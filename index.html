<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <div class="main_container">

    <div class="container">
      <div class="container_card_one"></div>
      <div class="container_card_two">
        <div class="summary">Summary</div>


        <div class="subjects" id="reaction">
          <div class="icon" id="icon_reaction"></div>
          <div class="subject_name" ><p id="one">Reaction</p></div>
          <div class="score">
            <span id="marks">80</span><span id="total_marks">/ 100</span>
          </div>
        </div>


        <div class="subjects" id="memory">
          <div class="icon" id="icon_memory"></div>
          <div class="subject_name" ><p id="two">Memory</p></div>
          <div class="score">
            <span id="marks">92</span><span id="total_marks">/ 100</span>
          </div>
        </div>


        <div class="subjects" id="verbal">
          <div class="icon" id="icon_verbal"></div>
          <div class="subject_name" ><p id="three">Verbal</p></div>
          <div class="score">
            <span id="marks">61</span><span id="total_marks">/ 100</span>
          
          </div>
        </div>


        <div class="subjects" id="visual">
          <div class="icon" id="icon_visual"></div>
          <div class="subject_name" ><p id="four">Visual</p></div>
          <div class="score">
            <span id="marks">73</span><span id="total_marks">/ 100</span>
           
          </div>
        </div>


        <div class="continue">
          <button>Continue</button>
        </div>
    </div>
  </div>
  
</body>
</html>
